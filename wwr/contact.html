<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | White Water Rafting</title>
    <meta name="description" content="Contact White Water Rafting for inquiries, reservations, or website suggestions.">
    <meta name="author" content="Asanda Jele">
    <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>
    <header>
        <img src="images/logo.jpg" alt="White Water Rafting Logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <h1>Contact White Water Rafting</h1>

        <!-- Company Information -->
        <div class="contact-info">
            <p>123 Main River Street</p>
            <p>Kolob, California</p>
            <p>+1 999 999 9999</p>
            <p>info@wwr.com</p>
        </div>

        <!-- Map and Form Layout -->
        <div class="contact-layout">
            
            <!-- Google Map -->
            <div class="map">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3153.33!2d-113.05!3d37.54!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zS29sb2IgQ2FueW9ucw!5e0!3m2!1sen!2sus!4v1620000000000!5m2!1sen!2sus" 
                        height="300" allowfullscreen="" loading="lazy"></iframe>
            </div>

            <!-- Contact Form -->
            <div class="form-section">
                <form>
                    <label for="fullname">Name</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Placeholder">

                    <label for="useremail">Email</label>
                    <input type="email" id="useremail" name="useremail" placeholder="Placeholder">

                    <fieldset>
                        <legend>Message Purpose</legend>
                        <div class="radio-options">
                            <input type="radio" id="general" name="purpose" value="general">
                            <label for="general">General Inquiry</label><br>
                            
                            <input type="radio" id="reservation" name="purpose" value="reservation">
                            <label for="reservation">Reservation Question</label><br>
                            
                            <input type="radio" id="suggestion" name="purpose" value="suggestion">
                            <label for="suggestion">Website Suggestion</label>
                        </div>
                    </fieldset>

                    <label for="message">Message</label>
                    <textarea id="message" name="message" placeholder="Type here"></textarea>

                    <div class="checkbox-group">
                        <input type="checkbox" id="newsletter" name="newsletter">
                        <label for="newsletter">Please subscribe me to the monthly newsletter</label>
                    </div>

                    <button type="submit">Get in Touch!</button>
                </form>
            </div>
        </div>

        <!-- Employee Profiles -->
        <section class="employees">
            <h2>We Are Here to Serve You</h2>
            <div class="employee-profiles">
                <figure>
                    <img src="images/employee1.jpg" alt="Employee Profile">
                    <figcaption>Employee Profile</figcaption>
                </figure>
                <figure>
                    <img src="images/employee2.jpg" alt="Employee Profile">
                    <figcaption>Employee Profile</figcaption>
                </figure>
                <figure>
                    <img src="images/employee3.jpg" alt="Employee Profile">
                    <figcaption>Employee Profile</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 White Water Rafting | Asanda Jele</p>
        <nav class="socialmedia">
            <a href="https://facebook.com"><img src="images/facebook.jpg" alt="Facebook"></a>
            <a href="https://instagram.com"><img src="images/instagram.jpg" alt="Instagram"></a>
            <a href="https://twitter.com"><img src="images/twitter.jpg" alt="Twitter"></a>
        </nav>
    </footer>
</body>
</html>
